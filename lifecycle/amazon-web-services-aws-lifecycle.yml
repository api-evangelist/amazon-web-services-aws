versioning:
  scheme: date-stamped-api-version
  current: '2016-11-15'
  note: >-
    AWS versions each service API with a dated version string carried in the request (EC2 Query:
    Version=2016-11-15) rather than in the URL path. A service API version is effectively permanent —
    AWS's long-standing posture is that an existing API version keeps working; new capability arrives as
    new Actions and new parameters on the same version.
  docs: https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Query-Requests.html
deprecation:
  policy_url: https://docs.aws.amazon.com/sdkref/latest/guide/maint-policy.html
  support_matrix: https://docs.aws.amazon.com/sdkref/latest/guide/version-support-matrix.html
  sunset_header: false
  note: >-
    The published, dated deprecation policy covers the AWS SDKs and Tools, not the service APIs: each
    SDK major version moves through generally-available, maintenance announcement, maintenance mode and
    end-of-support, with the phase dates published in the version support matrix. AWS does not emit
    RFC 8594 Sunset/Deprecation response headers on its APIs; deprecation is communicated through
    documentation, the What's New feed and account notifications. Service and feature retirements are
    announced individually rather than under one company-wide API deprecation policy.
  observed_maintenance_lines:
