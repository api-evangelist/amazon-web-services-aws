domain_standard:
  market: cloud infrastructure / IaaS
  finding: none-applicable
  note: >-
    REWARD-ONLY, and correctly unscored here. Cloud infrastructure has no cross-vendor interface
    standard the contract could declare — there is no IaaS equivalent of FHIR, SCIM, OpenRTB or
    ISO 20022. The nearest candidates were checked and none is declared by an AWS contract: SCIM 2.0
    appears only in AWS IAM Identity Center as a CONSUMER of a customer's IdP, not in an AWS-published
    contract; OData, OpenRTB, Sparkplug, ActivityPub, OAI-PMH and the education/library schemes are all
    out of market. Recorded as a checked absence, not invented to fill the slot.
  probed_for: [scim2, odata, openrtb, sparkplug, activitypub, oai-pmh, hl7v2, iso-20022, x12]
