  evidence: https://aws.amazon.com/compliance/pci-dss-level-1-faqs/
- id: hipaa
  conforms: true
  evidence: https://aws.amazon.com/compliance/hipaa-compliance/
- id: fedramp
  conforms: true
  evidence: https://aws.amazon.com/compliance/fedramp/
- id: gdpr
