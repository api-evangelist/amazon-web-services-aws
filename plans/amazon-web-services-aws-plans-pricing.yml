specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Amazon Web Services (AWS)
providerId: amazon-web-services-aws
created: '2026-05-04'
modified: '2026-09-01'
generated: '2026-09-01'
method: searched
source: https://aws.amazon.com/free/
docs: https://aws.amazon.com/pricing/
description: >-
  AWS account plans and the pricing models that govern API usage, read from aws.amazon.com/free/ and
  aws.amazon.com/pricing/ on 2026-09-01. This REPLACES the 2026-05-04 scaffold, which asserted a
  "1,000 API requests per month" free quota that AWS has never published and that does not describe how
  AWS charges for anything. The correction matters: AWS does not meter the API. Control-plane API calls
  are overwhelmingly free — you are billed for the RESOURCES the calls create and the time they run,
  metered per service. A handful of services do charge per request (Amazon API Gateway per million
  calls, AWS Config per configuration item, Amazon S3 per 1,000 requests), and those charges are
  documented on each service's own pricing page rather than in one platform-wide plan.
plan_count: 2
pricing_model: usage-based, per service, no platform-wide API request plan
plans:
- id: amazon-web-services-aws-free
  name: Free plan (AWS Free Tier)
  type: freemium
  price: 0
  currency: USD
  billing_period: none
  url: https://aws.amazon.com/free/
  description: >-
    New AWS Free Tier accounts receive $100 in credits immediately and can earn up to $100 more by
    exploring key services — up to $200 over 6 months. The account closes on its own 6 months after it
    is opened or when the credits run out, whichever comes first, and is never charged unless it is
    converted to a Paid plan.
  entries:
  - label: Sign-up credits
    name: signup_credits
    type: credit
    limit: 100
    unit: USD
    note: Granted immediately on account creation.
  - label: Earnable credits
    name: earned_credits
    type: credit
    limit: 100
    unit: USD
    note: Earned by completing activities across key services; $200 maximum in total.
  - label: Plan duration
    name: duration
    type: window
    limit: 6
    timeFrame: month
    note: The account auto-closes at 6 months or on credit exhaustion, whichever comes first.
  - label: Always-free services
    name: always_free
    type: quota
    limit: null
    note: >-
      More than 30 AWS services stay free within published monthly usage limits on BOTH the Free and
      Paid plans. Per-service limits are published on each service's pricing page; not enumerated here.
  - label: Short-term trials
    name: trials
    type: trial
    limit: null
    note: Selected paid services offer limited free trials that begin when the service is activated.
- id: amazon-web-services-aws-paid
  name: Paid plan
  type: pay-as-you-go
  price: null
  currency: USD
  billing_period: month
  url: https://aws.amazon.com/pricing/
  description: >-
    Usage-based billing across every AWS service, invoiced monthly, with no minimum and no platform
    subscription fee. There is no seat count and no API call allowance — price is a function of the
    resources provisioned and consumed.
  entries:
  - label: On-Demand
    name: on_demand
    type: rate
    limit: null
    note: Pay per second or per hour of use with no commitment. https://aws.amazon.com/ec2/pricing/on-demand/
  - label: Savings Plans
    name: savings_plans
    type: commitment
    limit: null
    note: >-
      Discounted rates in exchange for a committed hourly spend over a 1- or 3-year term.
      https://aws.amazon.com/savingsplans/
  - label: Reserved Instances
    name: reserved
    type: commitment
    limit: null
    note: Capacity reserved for a 1- or 3-year term at a discount to On-Demand.
  - label: Spot Instances
    name: spot
    type: rate
    limit: null
    note: Spare capacity at a steep discount, interruptible with a two-minute notice.
  - label: Always-free allowances
    name: always_free
    type: quota
    limit: null
    note: The 30+ always-free service limits continue to apply on the Paid plan.
enterprise:
  available: true
  note: >-
    Enterprise Discount Programs and private pricing are negotiated directly with AWS and are not
    published. AWS Marketplace private offers are the contractual vehicle for third-party software.
tags:
- Cloud Computing
- Pricing
- Free Tier
- Usage Based
