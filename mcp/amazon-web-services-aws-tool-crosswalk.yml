note: >-
  The crosswalk's headline finding is a clean surface divergence, not a mapping. Every tool the hosted
  AWS Knowledge MCP Server exposes is a DOCUMENTATION and METADATA tool — read the docs, search the docs,
  list regions, check regional availability, fetch a skill. None of them binds to an AWS control-plane
  operation, so the REST/Query contract in openapi/ and the remote MCP surface do not overlap at all.
  The control plane is reachable over MCP only through the local-stdio awslabs servers, which execute
  under the operator's own IAM credentials and are therefore not introspectable anonymously; their tool
  schemas need an authenticated local run to capture.
