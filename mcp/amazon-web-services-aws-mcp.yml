deployment:
  mode: both
  endpoint: https://knowledge-mcp.global.api.aws/mcp
  install: uvx awslabs.aws-api-mcp-server@latest
  package: https://pypi.org/project/awslabs.aws-api-mcp-server/
  auth: none
  verified: probed
note: >-
  AWS ships BOTH shapes of MCP server and they are not the same product. The AWS Knowledge MCP Server is
  a hosted remote endpoint an agent can POST to right now with no account, no key and no install — an
  `initialize` and a `tools/list` both returned HTTP 200 anonymously during this pass. Separately,
  github.com/awslabs/mcp publishes 62 first-party local-stdio servers (one per service area) distributed
  through PyPI under the `awslabs.*` namespace; those require a human to install and run them on a
  machine before any agent sees them. Both are recorded because both are real work by the provider, and
  only the first is reachable by an agent unattended.
servers:
- name: AWS Knowledge MCP Server
  kind: remote
  transport: streamable-http
  url: https://knowledge-mcp.global.api.aws/mcp
  auth: none
  server_info:
    name: AWSKnowledgeMCP
    version: 1.0.0
    protocolVersion: '2025-03-26'
  docs: https://github.com/awslabs/mcp/tree/main/src/aws-knowledge-mcp-server
  tools_file: amazon-web-services-aws-mcp-tools.json
  x-evidence:
    probed: '2026-09-01'
    initialize_status: 200
    tools_list_status: 200
    tool_count: 5
- name: awslabs MCP server suite
  kind: local-stdio
  transport: stdio
  install: uvx awslabs.<server-name>@latest
  registry: pypi
  namespace: awslabs.*
  repository: https://github.com/awslabs/mcp
  docs: https://awslabs.github.io/mcp/
  server_count: 62
  auth: aws-credentials
  note: >-
