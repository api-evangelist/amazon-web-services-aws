specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Amazon Web Services (AWS)
providerId: amazon-web-services-aws
created: '2026-05-04'
modified: '2026-09-01'
generated: '2026-09-01'
method: searched
source: https://docs.aws.amazon.com/AWSEC2/latest/APIReference/throttling.html
docs: https://docs.aws.amazon.com/AWSEC2/latest/APIReference/throttling.html
description: >-
  Published Amazon EC2 API throttling limits, read from the EC2 API Reference on 2026-09-01. This
  replaces the 2026-05-04 scaffold, whose tiers were placeholder defaults. AWS throttles per AWS account
  per Region using a token-bucket algorithm, and publishes the exact bucket capacity and refill rate for
  each action category. Limits are per service — these are EC2's; other AWS services publish their own,
  and account-level quotas are visible and adjustable through AWS Service Quotas.
algorithm: token-bucket
scope: per-account, per-Region, per-API-action
limit_count: 8
rate_limits:
- name: Non-mutating actions
  scope: per-account per-Region per-action
  applies_to: Describe*, List*, Search*, Get* actions not in another category
  limit: 100
  unit: requests
  window: 1s
  burst: 100
  refill_rate: 20 per second
  type: request-token-bucket
- name: Unfiltered and unpaginated non-mutating actions
  scope: per-account per-Region per-action
  applies_to: DescribeInstances, DescribeInstanceStatus, DescribeNetworkInterfaces, DescribeSecurityGroups,
    DescribeSnapshots, DescribeSpotInstanceRequests, DescribeVolumes — when called without pagination or a filter
  limit: 50
  unit: requests
  window: 1s
  burst: 50
  refill_rate: 10 per second
  type: request-token-bucket
  note: Using pagination or a filter moves the call into the larger non-mutating bucket.
- name: Mutating actions
  scope: per-account per-Region per-action
  applies_to: All mutating actions that are not resource-intensive or uncategorized
  limit: 50
  unit: requests
  window: 1s
  burst: 50
  refill_rate: 5 per second
  type: request-token-bucket
- name: Resource-intensive actions
  scope: per-account per-Region per-action
  applies_to: AcceptVpcPeeringConnection, AuthorizeSecurityGroupIngress, CancelSpotInstanceRequests,
    CreateKeyPair, CreateVpcPeeringConnection, DeleteVpcPeeringConnection, RejectVpcPeeringConnection,
    RevokeSecurityGroupIngress, RequestSpotInstances
  limit: 50
  unit: requests
  window: 1s
  burst: 50
  refill_rate: 5 per second
  type: request-token-bucket
- name: Console non-mutating actions
  scope: per-account per-Region per-action
  applies_to: Describe*/List*/Search*/Get* actions called from the Amazon EC2 console
  limit: 100
  unit: requests
  window: 1s
  burst: 100
  refill_rate: 10 per second
  type: request-token-bucket
- name: Uncategorized actions
  scope: per-account per-Region per-action
  applies_to: Named actions with their own published bucket, e.g. AcceptVpcEndpointConnections (10 / 1 per second),
    AssignPrivateIpAddresses (100 / 5 per second), AdvertiseByoipCidr (1 / 0.1 per second), CopyImage (100 / 1 per second)
  limit: null
  unit: requests
  window: 1s
  type: request-token-bucket
  note: >-
    Per-action values, published as a table in the throttling reference. Not enumerated here; read the
    docs URL for the full list.
- name: RunInstances resource rate limit
  scope: per-account per-Region
  applies_to: RunInstances
  limit: 1000
  unit: instances
  burst: 1000
  refill_rate: 2 per second
  type: resource-token-bucket
  note: >-
    Independent of the request bucket and depletes by the number of RESOURCES affected, so one request
    for 1000 instances and four requests for 250 cost the same.
- name: TerminateInstances resource rate limit
  scope: per-account per-Region
  applies_to: TerminateInstances
  limit: null
  unit: instances
  type: resource-token-bucket
  note: >-
    AWS documents TerminateInstances as resource-rate-limited alongside RunInstances but the published
    bucket values are in the per-action table rather than the prose; recorded as present, value unread
    rather than guessed.
response_headers: []
response_headers_note: >-
  AWS returns NO rate-limit headers. There is no RateLimit-*, no X-RateLimit-*, and no Retry-After on a
  throttled response. An agent learns it is throttled only from the error, which is the significant gap
  in this contract.
exhaustion:
  error_code: RequestLimitExceeded
  http_status: 503
  alternate_error_code: ThrottlingException
  alternate_http_status: 400
  guidance: Retry with exponential backoff and jitter; the AWS SDKs do this automatically.
  docs: https://docs.aws.amazon.com/general/latest/gr/api-retries.html
quota_management:
  service: AWS Service Quotas
  docs: https://docs.aws.amazon.com/servicequotas/latest/userguide/intro.html
  note: Current limits are viewable and increases requestable through the Service Quotas console and API.
tags:
- Rate Limiting
- Quotas
- Throttling
- Cloud Computing
