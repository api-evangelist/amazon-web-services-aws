source: >-
  https://aws.amazon.com/tools/ plus the public registry metadata endpoints (registry.npmjs.org,
  pypi.org/pypi/*/json, rubygems.org/api/v1, crates.io/api/v1, proxy.golang.org, repo1.maven.org,
  api.nuget.org, repo.packagist.org), all read unauthenticated on 2026-09-01.
note: >-
  AWS ships a first-party SDK in every major language, generated per-service from its internal Smithy
  service models. Where a language has hundreds of per-service artifacts, one representative client is
  recorded alongside the umbrella/core package rather than enumerating the whole set. Currency is the
  headline here: every actively maintained SDK line published within the last week of the probe. The one
  clear decay signal is the v2 generation — npm `aws-sdk` (v2) last published 2025-12-09 and Maven
  `com.amazonaws:aws-java-sdk` (v1) 2025-12-30, both formally in maintenance while their v3/v2 successors
  release daily.
